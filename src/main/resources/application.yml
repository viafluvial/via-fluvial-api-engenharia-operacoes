server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: api-engenharia-operacoes
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db-engenharia-operacoes}
    username: ${DB_USERNAME:engenharia-operacoes_app}
    password: ${DB_PASSWORD:engenharia-operacoes_app}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:sc-engenharia-operacoes}
        format_sql: false
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:sc-engenharia-operacoes}
    schemas: ${DB_SCHEMA:sc-engenharia-operacoes}
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    urls:
      - name: OpenAPI Runtime
        url: /v3/api-docs
      - name: OpenAPI Estatico
        url: /openapi/openapi.yaml

security:
  mode: ${SECURITY_MODE:oauth2}
  dev:
    roles: ${SECURITY_DEV_ROLES:ADMINISTRADOR,SUPORTE,AUDITOR}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}

management:
  endpoints:
    access:
      default: unrestricted
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

engineering:
  checks:
    enabled: ${ENGINEERING_CHECK_SCHEDULER_ENABLED:true}
    interval-seconds: ${ENGINEERING_CHECK_INTERVAL_SECONDS:30}
    timeout-millis: ${ENGINEERING_CHECK_TIMEOUT_MILLIS:4000}
    history-retention-days: ${ENGINEERING_HISTORY_RETENTION_DAYS:15}
    max-concurrency: ${ENGINEERING_CHECK_MAX_CONCURRENCY:8}
  registry:
    services:
      - key: identidade-autenticacao
        name: api-identidade-autenticacao
        category: Identidade e Acesso
        local-direct-base-url: http://${ENGINEERING_DSV_HOST:${ENGINEERING_LOCAL_HOST:localhost}}:18001/api/v1
